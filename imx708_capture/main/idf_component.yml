dependencies:
  espressif/esp_video: ^2.4
  idf: '>=5.4'
  # 0.4.0: modo 1280x720 e correções de quadro corrompido / sensor travado.
  mushbraindave/esp_cam_sensor_imx: ^0.4.0
  # Modelos de detecção e de características de rosto (puxa human_face_detect
  # e esp-dl). "~0.3.2" e não "*": com "*" o solver olha as 0.1.x, que puxam
  # BSP + LVGL e derrubam o configure.
  espressif/human_face_recognition: ~0.3.2
  # O P4 não tem rádio: estes levam as chamadas esp_wifi_* ao ESP32-C6 por SDIO.
  # esp_hosted fica na linha 2.12: é a combinação já testada com o firmware de
  # fábrica do C6 nas placas Waveshare (a 3.x nunca foi testada contra ele).
  espressif/esp_hosted: ~2.12.12
  espressif/esp_wifi_remote: ^1.6
  # Driver do codec ES8311 (microfone da placa); é o mesmo que os exemplos do
  # ESP-SR usam, então serve para wake word depois.
  espressif/esp_codec_dev: ~1.6
  # Página de fala: WakeNet10 "Olá ESP", MultiNet7 (inglês) e AFE. Pede
  # esp-dl ~3.3.12 - a mesma linha dos modelos de rosto (3.3.13 no lock).
  # Os modelos vão para a partição "model" (srmodels.bin, no idf.py flash).
  espressif/esp-sr: ~2.6.0
